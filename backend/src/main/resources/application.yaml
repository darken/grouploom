spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    servlet:
      path: /api
    problemdetails:
      enabled: true
server:
  port: 8080
