<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(content)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title th:text="${subject}">Subject</title>
<style>
  @media (prefers-color-scheme: dark) {
    body, .page { background-color: #000000 !important; }
    .card { background-color: #1c1c1e !important; }
    .primary { color: #f5f5f7 !important; }
    .secondary { color: #98989d !important; }
    .link { color: #2997ff !important; }
    .note { background-color: #2c2c2e !important; }
    .danger { color: #ff453a !important; }
  }
  @media only screen and (max-width: 600px) {
    .card { padding: 28px 20px !important; }
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#f5f5f7;">
<table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td class="card" style="background-color:#ffffff;border-radius:16px;padding:40px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p class="secondary" th:text="${groupName}" style="margin:0 0 20px 0;font-size:14px;line-height:20px;color:#6e6e73;">Group</p>
            <th:block th:replace="${content}">content</th:block>
            <p class="secondary" style="margin:32px 0 0 0;font-size:13px;line-height:20px;color:#6e6e73;">
              You're getting this because you're a member of [[${groupName}]].
              <a class="link" th:href="${preferencesLink}" href="#" style="color:#0066cc;text-decoration:none;">Choose which events you hear about</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
