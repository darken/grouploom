<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(content)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title th:text="${subject}">Subject</title>
<style>
  @media (prefers-color-scheme: dark) {
    body, .page { background-color: #000000 !important; }
    .card { background-color: #1c1c1e !important; }
    .primary { color: #f5f5f7 !important; }
    .secondary { color: #98989d !important; }
    .link { color: #2997ff !important; }
    .note { background-color: #2c2c2e !important; }
    .danger { color: #ff453a !important; }
    .btn-fill { background-color: #2997ff !important; }
    .btn-fill-text { color: #000000 !important; }
    .btn-outline { border-color: #2997ff !important; }
    .btn-outline-text { color: #2997ff !important; }
  }
  @media only screen and (max-width: 600px) {
    .card { padding: 28px 20px !important; }
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#f5f5f7;">
<table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td class="card" style="background-color:#ffffff;border-radius:16px;padding:40px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p class="secondary" th:text="${groupName}" style="margin:0 0 20px 0;font-size:14px;line-height:20px;color:#6e6e73;">Group</p>
            <th:block th:replace="${content}">content</th:block>
            <p class="secondary" style="margin:32px 0 0 0;font-size:13px;line-height:20px;color:#6e6e73;">
              You're getting this because you're a member of [[${groupName}]].
              <a class="link" th:href="${preferencesLink}" href="#" style="color:#0066cc;text-decoration:none;">Choose which events you hear about</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
<th:block th:fragment="attendance">
  <div th:if="${currentResponse == null}" style="margin:28px 0 0 0;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="btn-fill" bgcolor="#0066cc" style="background-color:#0066cc;border-radius:12px;border:1px solid #0066cc;">
          <a class="btn-fill-text" th:href="${goingLink}" href="#" style="display:inline-block;padding:12px 28px;font-size:16px;line-height:22px;font-weight:600;color:#ffffff;text-decoration:none;">Going</a>
        </td>
        <td style="width:12px;font-size:0;line-height:0;">&nbsp;</td>
        <td class="btn-outline" style="border-radius:12px;border:1px solid #0066cc;">
          <a class="btn-outline-text" th:href="${notGoingLink}" href="#" style="display:inline-block;padding:12px 28px;font-size:16px;line-height:22px;font-weight:600;color:#0066cc;text-decoration:none;">Can't go</a>
        </td>
      </tr>
    </table>
    <p class="secondary" style="margin:12px 0 0 0;font-size:13px;line-height:20px;color:#6e6e73;">You can change your answer until the event starts.</p>
  </div>
  <div th:if="${currentResponse != null}" style="margin:28px 0 0 0;">
    <p class="primary" th:if="${currentResponse == 'GOING'}" style="margin:0;font-size:16px;line-height:24px;font-weight:500;color:#1d1d1f;">You're going</p>
    <p class="primary" th:if="${currentResponse == 'NOT_GOING'}" style="margin:0;font-size:16px;line-height:24px;font-weight:500;color:#1d1d1f;">You said you can't go</p>
    <p style="margin:4px 0 0 0;font-size:15px;line-height:22px;"><a class="link" th:href="${changeLink}" href="#" style="color:#0066cc;text-decoration:none;">Change answer</a></p>
  </div>
</th:block>
</html>
